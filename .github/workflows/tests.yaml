name: tests
on:
- push
- workflow_dispatch
- pull_request
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - python: "3.11"
                      env: py311
                    - python: "3.12"
                      env: py312
                    - python: "3.13"
                      env: py313
                    - python: "3.14"
                      env: py314
                    - python: "3.15"
                      env: py315
                    - python: "3.15"
                      env: py315-namespace
                    - python: pypy-3.10
                      env: pypy3
        name: ${{ matrix.env }} on Python ${{ matrix.python }}
        steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
              python-version: ${{ matrix.python }}
        - run: pip install tox
        - run: tox
          env:
            TOXENV: ${{ matrix.env }}
