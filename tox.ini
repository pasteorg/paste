[tox]
envlist = py{311, 312, 313, 314, 315, py},py315-namespace

[base]
deps =
    pytest

[testenv]
# For performance, but also for using "source" with coveragepy (https://github.com/nedbat/coveragepy/issues/268).
usedevelop = True
deps =
    {[base]deps}
    coverage: coverage
    coverage: pytest-cov
setenv =
    coverage: PYTEST_ADDOPTS=--cov --cov-report=term-missing
commands =
    python -m pytest {posargs}

# Test an environment where paste, pastedeploy and pastescript are already
# installed.
[testenv:py315-namespace]
deps =
    {[base]deps}
    Paste==3.9.0
    PasteDeploy
    pastescript
